name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django PyPDF2 pytest pytest-django ruff
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: pdf_utility.settings
        run: |
          python manage.py migrate
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: pdf_utility.settings
        run: |
          pytest -q
      - name: Lint with ruff
        run: |
          ruff check .